<div *ngFor="let message of messages" (click)="onMessageClick(message, $event)">
  <!-- Message Header -->
  <div class="msg-header" *ngIf="message.showDateHeader">
    <span></span>
    <p>{{ message.date }}</p>
  </div>
  <!-- Own Message -->
  <ng-container *ngIf="message.senderID === currentUser; else otherMessage">
    <div class="msg-own">
      <div
        [ngClass]="{ 'msg-own-active': selectedMessage === message }"
        class="msg-own-body"
      >
        <div class="msg-avatar">
          <img
            src="./../../../assets/img/avatar/{{ message.avatar }}.png"
            alt=""
          />
        </div>
        <div class="msg-own-main">
          <div class="msg-own-info">
            <button class="chatter-name nuito18px700">
              {{ message.username }}
            </button>
            <p class="msg-time">{{ message.formattedTime }}</p>
          </div>
          <div class="msg-own-content">
            <p class="msg-text">
              <ng-container *ngFor="let part of parseMessageWithMentionsAndHashtags(message.text)">
                <span *ngIf="part.isMention" class="mention">{{ part.text }}</span>
                <span *ngIf="part.isHashtag" class="hashtag">{{ part.text }}</span>
                <span *ngIf="!part.isMention && !part.isHashtag">{{ part.text }}</span>
              </ng-container>
            </p>
          </div>
          <div class="msg-own-answers">
            <button>{{ message.answersCount }} Antworten</button>
            <p class="answer-time">{{ message.lastAnswerTime }}</p>
          </div>
          <div class="msg-reactions-own">
            <ng-container *ngIf="message.reactions && message.reactions.length > 0">
              <button
                *ngFor="let reaction of reactionsExpanded[message.id] ? message.reactions : (message.reactions | slice : 0 : 7)"
                (click)="selectReaction(reaction.reaction, message)"
                class="reaction"
                (mouseover)="showReactorNames(reaction.reactors, $event)"
                (mouseout)="hideReactorNames()"
              >
                {{ reaction.reaction }} {{ reaction.count }}
                <div class="reaction-popup" *ngIf="hoveredReactorNames?.length">
                  <p>{{ reaction.reaction }}</p>
                  <p class="reaction-hover-names" [innerHTML]="formatReactorNames(hoveredReactorNames)"></p>
                </div>
              </button>
              <button
                *ngIf="message.reactions.length > 7"
                (click)="toggleReactions(message)"
                class="reaction"
              >
                {{
                  reactionsExpanded[message.id]
                    ? "Weniger anzeigen"
                    : "+" + (message.reactions.length - 7) + " weitere"
                }}
              </button>
              <button class="icon-button">
                <mat-icon
                  (click)="toggleReactionPicker(message, $event)"
                  fontSet="material-icons-outlined"
                  >add_reaction</mat-icon
                >
              </button>
            </ng-container>
          </div>
        </div>
      </div>
      <div class="popup-menu-own" [class.active]="selectedMessage === message">
        <button
          *ngFor="let reaction of getLastTwoReactions(message)"
          (click)="selectReaction(reaction, message)"
        >
          {{ reaction }}
        </button>
        <button>
          <mat-icon
            (click)="toggleReactionPicker(message, $event)"
            fontSet="material-icons-outlined"
            >add_reaction</mat-icon
          >
        </button>
        <button>
          <mat-icon fontSet="material-icons-outlined">message</mat-icon>
        </button>
        <button (click)="toggleMoreMenu(message, $event)">
          <mat-icon fontSet="material-icons-outlined">more_vert</mat-icon>
        </button>
        <div
          class="more-vert-popup"
          *ngIf="message.showMoreMenu"
          (clickOutside)="message.showMoreMenu = false"
        >
          <button (click)="onEditClick(message)">Nachricht bearbeiten</button>
        </div>
      </div>
      <app-reaction-picker
        *ngIf="activeReactionPickerId === message.id"
        (reactionSelected)="selectReaction($event, message)"
      ></app-reaction-picker>
    </div>
  </ng-container>

  <!-- Other Message -->
  <ng-template #otherMessage>
    <div class="msg">
      <div
        [ngClass]="{ 'msg-active': selectedMessage === message }"
        class="msg-body"
      >
        <div class="msg-avatar">
          <img
            src="./../../../assets/img/avatar/{{ message.avatar }}.png"
            alt=""
          />
        </div>
        <div class="msg-main">
          <div class="msg-info">
            <button class="chatter-name nuito18px700">
              {{ message.username }}
            </button>
            <p class="msg-time">{{ message.formattedTime }}</p>
          </div>
          <div class="msg-content">
            <p class="msg-text">
              <ng-container *ngFor="let part of parseMessageWithMentionsAndHashtags(message.text)">
                <span *ngIf="part.isMention" class="mention">{{ part.text }}</span>
                <span *ngIf="part.isHashtag" class="hashtag">{{ part.text }}</span>
                <span *ngIf="!part.isMention && !part.isHashtag">{{ part.text }}</span>
              </ng-container>
            </p>
          </div>
          <div class="msg-answers">
            <button>{{ message.answersCount }} Antworten</button>
            <p class="answer-time">{{ message.lastAnswerTime }}</p>
          </div>
          <div class="msg-reactions">
            <ng-container *ngIf="message.reactions && message.reactions.length > 0">
              <button
                *ngFor="let reaction of reactionsExpanded[message.id] ? message.reactions : (message.reactions | slice : 0 : 7)"
                (click)="selectReaction(reaction.reaction, message)"
                class="reaction"
                (mouseover)="showReactorNames(reaction.reactors, $event)"
                (mouseout)="hideReactorNames()"
              >
                {{ reaction.reaction }} {{ reaction.count }}
                <div class="reaction-popup" *ngIf="hoveredReactorNames">
                  <p>{{ reaction.reaction }}</p>
                  <p [innerHTML]="formatReactorNames(hoveredReactorNames)"></p>
                </div>
              </button>
              <button
                *ngIf="message.reactions.length > 7"
                (click)="toggleReactions(message)"
                class="reaction"
              >
                {{
                  reactionsExpanded[message.id]
                    ? "Weniger anzeigen"
                    : "+" + (message.reactions.length - 7) + " weitere"
                }}
              </button>
              <button class="icon-button">
                <mat-icon
                  (click)="toggleReactionPicker(message, $event)"
                  fontSet="material-icons-outlined"
                  >add_reaction</mat-icon
                >
              </button>
            </ng-container>
          </div>
        </div>
      </div>
      <div class="popup-menu" [class.active]="selectedMessage === message">
        <button
          *ngFor="let reaction of getLastTwoReactions(message)"
          (click)="selectReaction(reaction, message)"
        >
          {{ reaction }}
        </button>
        <button>
          <mat-icon
            (click)="toggleReactionPicker(message, $event)"
            fontSet="material-icons-outlined"
            >add_reaction</mat-icon
          >
        </button>
        <button>
          <mat-icon fontSet="material-icons-outlined">message</mat-icon>
        </button>
      </div>
      <app-reaction-picker
        *ngIf="activeReactionPickerId === message.id"
        (reactionSelected)="selectReaction($event, message)"
      ></app-reaction-picker>
    </div>
  </ng-template>
</div>
