<!-- Mobile: nur eine Chat-Instanz -->
@if (isMobile) {
  <app-chat-template></app-chat-template>
} @else {
  <!-- Desktop: zwei Instanzen nebeneinander -->
  <div class="chat-template-container">
    <!-- Main Chat -->
    <app-chat-template class="chat-view" [isThreadView]="false"></app-chat-template>

    <!-- Thread Chat (nur wenn offen) -->
    @if (threadIsOpen$ | async) {
      <app-chat-template
        class="chat-view thread-view"
        [isThreadView]="true"
      ></app-chat-template>
    }
  </div>
}
