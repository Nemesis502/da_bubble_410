<app-header [currentUser]="(currentUser$ | async)"></app-header>

<section class="main">
  <button class="show-main-menu" (click)="showMainMenu = !showMainMenu">
    <p>
      {{ showMainMenu ? "Workspace-Menü schließen" : "Workspace-Menü öffnen" }}
    </p>
    <mat-icon
      fontIcon="{{ showMainMenu ? 'chevron_left' : 'chevron_right' }}"
    ></mat-icon>
  </button>

  <section
    class="left"
    [class.menu-open]="showMainMenu"
    [class.menu-closed]="!showMainMenu"
  >
    <app-main-menu (closeNewMessage)="showNewMessage = false" (newMessage)="openNewMessage()" (chatSelected)="onChatSelected($event)"></app-main-menu>
  </section>

  <section class="center">
    <app-chat-template *ngIf="!showNewMessage"
      [chatId]="currentChatId"
      (threadOpened)="openThread($event)"
    ></app-chat-template>
    <!-- Conditionally render the new message component -->
    <app-new-message *ngIf="showNewMessage" (close)="closeNewMessage()"></app-new-message>
  </section>

@if (showThread) {
  <section class="right">
    <app-threads
      [threadId]="currentThreadId"
      (threadClosed)="closeThread()"
    ></app-threads>
  </section>
}
</section>
