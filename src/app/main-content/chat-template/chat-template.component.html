<div class="comp-body">
  <section class="header">
    <button (click)="navigateToMain()" class="back-btn nuito18px700">
      <mat-icon class="mat-icon-top" fontIcon="arrow_back_ios_new"></mat-icon>
      <img src="./assets/img/workspace-logo.png" />
      <p>Devspace</p>
    </button>
    <button class="profile-btn" (click)="openMenuDialog()">
      <ng-container
        *ngIf="currentUser?.profilePic; else defaultCurrentUserAvatar"
      >
        <img
          [src]="'./assets/img/avatar/' + currentUser?.profilePic + '.png'"
          alt="User Avatar"
          aria-hidden="true"
        />
      </ng-container>
      <ng-template #defaultCurrentUserAvatar>
        <img
          src="./assets/img/avatar/0.png"
          alt="Default Avatar"
          aria-hidden="true"
        />
      </ng-template>
    </button>
  </section>

  <section class="chat-header">
    <button class="channel-button">
      <!-- Show "numbers" icon only when not in thread view -->
      <mat-icon
        (click)="openChannelInfo()"
        *ngIf="chatIsChannel"
        fontSet="material-icons-outlined"
      >
        numbers
      </mat-icon>

      <!-- Show other user avatar + name if chatIsConversation -->
      <ng-container
        class="convo-header"
        *ngIf="chatIsConversation && !chatIsThread"
      >
        <ng-container
          (click)="openProfileDialogOtherUser()"
          *ngIf="otherUser?.profilePic; else defaultOtherUserAvatar"
        >
          <img
            (click)="openProfileDialogOtherUser()"
            class="other-user-avatar"
            [src]="'./assets/img/avatar/' + otherUser?.profilePic + '.png'"
            alt="{{ otherUser?.userName }}'s avatar"
          />
        </ng-container>
        <ng-template #defaultOtherUserAvatar>
          <img
            class="other-user-avatar"
            src="./assets/img/avatar/0.png"
            alt="Default Avatar"
          />
        </ng-template>

        <div
          (click)="openProfileDialogOtherUser()"
          class="status-dot"
          [ngClass]="{ online: otherUser?.status, offline: !otherUser?.status }"
        ></div>
        <p
          class="other-user-name nuito18px700"
          (click)="openProfileDialogOtherUser()"
        >
          {{ otherUser?.userName }}
        </p>
      </ng-container>
      <!-- Channel name -->
      <p class="channel-name nuito18px700">
        <ng-container *ngIf="chatIsThread">
          Thread <span class="channel-hash">#</span>
          <span class="channel-name-thread">
            {{
              chatIsConversation ? otherUser?.userName : selectedChannel?.name
            }}
          </span>
        </ng-container>
        <ng-container
          (click)="openChannelInfo()"
          *ngIf="chatIsChannel"
          #normalChannelName
        >
          {{ selectedChannel?.name }}
        </ng-container>
      </p>

      <mat-icon
        *ngIf="chatIsChannel"
        (click)="openChannelInfo()"
        class="mat-icon-top"
        fontIcon="keyboard_arrow_down"
      ></mat-icon>
    </button>

    <!-- Thread view: show X button -->
    <button
      *ngIf="chatIsThread"
      class="x-button"
      (click)="closeThreadView()"
      aria-label="Close Thread"
    >
      <mat-icon fontIcon="close"></mat-icon>
    </button>

    <!-- Normal view: show Add User button -->
    <ng-container *ngIf="chatIsChannel">
      <button class="add-user-button" (click)="openMemberDialog()">
        <mat-icon class="mat-icon-top" fontIcon="person_add_alt"></mat-icon>
      </button>
    </ng-container>
  </section>

  <section class="chat-body" #chatBody>
    <!-- Thread view -->
    <ng-container *ngIf="chatIsThread; else fullChat">
      <!-- Parent (active) thread message -->
      <app-message-template
        [chatIsThread]="chatIsThread"
        *ngIf="activeThreadMessage"
        [messages]="[activeThreadMessage]"
        [currentUser]="currentUser?.id || ''"
        [currentChannelId]="selectedChannel?.channelId"
        (editMessage)="startEditingMessage($event)"
        (replyToMessage)="handleReplyToMessage($event)"
      ></app-message-template>

      <!-- Antworten counter -->
      <div class="msg-header" *ngIf="threadMessages$ | async as threadMessages">
        <p>{{ threadMessages.length }} Antworten</p>
        <span></span>
      </div>

      <!-- Replies to thread -->
      <app-message-template
        [chatIsThread]="chatIsThread"
        *ngIf="threadMessages$ | async as threadMessages"
        [messages]="threadMessages"
        [currentUser]="currentUser?.id || ''"
        [currentChannelId]="selectedChannel?.channelId"
        (editMessage)="startEditingMessage($event)"
        (replyToMessage)="handleReplyToMessage($event)"
      ></app-message-template>
    </ng-container>

    <!-- Full channel chat view -->
    <ng-template #fullChat>
      <app-message-template
        [chatIsThread]="chatIsThread"
        [messages]="messages"
        [currentUser]="currentUser?.id || ''"
        [currentChannelId]="selectedChannel?.channelId"
        (editMessage)="startEditingMessage($event)"
        (replyToMessage)="handleReplyToMessage($event)"
      ></app-message-template>
    </ng-template>
  </section>

  <section class="chat-interface">
    <mat-card class="chat-card" appearance="outlined">
      <textarea
        [(ngModel)]="chatMessage"
        id="chat-field"
        #chatField
        (keydown)="checkMentionTrigger($event)"
        [placeholder]="
          chatIsThread
            ? 'Antworten...'
            : chatIsChannel
            ? 'Nachricht an #' + (selectedChannel?.name || '')
            : 'Nachricht an ' + (otherUser?.userName || '')
        "
      ></textarea>

      <!--  @ Popup -->
      <div class="mention-popup" *ngIf="mentionPopupVisible">
        <div
          class="mention-user"
          *ngFor="let user of filteredMentionableUsers"
          (click)="selectMentionUser(user.userName)"
        >
          <img
            class="avatar"
            [src]="'./../../../assets/img/avatar/' + user.profilePic + '.png'"
            alt="avatar"
          />
          <div
            class="status-dot"
            [ngClass]="{ online: user.status, offline: !user.status }"
          ></div>
          <span class="mention-name nuito17px400"
            >{{ user.userName
            }}<span *ngIf="user.userName === currentUser?.userName">
              (Du)</span
            ></span
          >
        </div>
      </div>
      <!--  # Popup -->
      <div class="mention-popup" *ngIf="hashtagPopupVisible">
        <div
          class="hashtag-item"
          *ngFor="let channel of filteredChannels"
          (click)="selectHashtagChannel(channel.name)"
        >
          <span class="hashtag-name nuito17px400">
            <span class="hashtag">#</span>{{ channel.name }}
          </span>
        </div>
      </div>

      <mat-card-actions class="chat-buttons">
        <div class="buttons-left">
          <button (click)="toggleEmojiPicker($event)">
            <mat-icon fontIcon="insert_emoticon"></mat-icon>
          </button>
          <button (click)="triggerMention()">
            <mat-icon fontIcon="alternate_email"></mat-icon>
          </button>
        </div>
        <div class="button-right">
          <button (click)="sendMessage()">
            <mat-icon fontIcon="send"></mat-icon>
          </button>
        </div>
      </mat-card-actions>
    </mat-card>
    <!-- Emoji Picker -->
    <app-emoji-picker
      *ngIf="emojiPickerVisible"
      [pickerPosition]="pickerPosition"
      (emojiSelected)="addEmoji($event)"
      (pickerClosed)="onPickerClosed()"
    ></app-emoji-picker>
  </section>
</div>
