@if (screenSmall) {
<section class="main-header">
    <img class="logo-name" src="./assets/img/logo-name.png" alt="Logo und Name" />
    <button aria-label="Menü öffnen" (click)="openMenuDialog()">
        <img src="./assets/img/avatar/{{currentUser?.profilePic}}.png" alt="" aria-hidden="true" />
    </button>
</section>
} @else {
<section class="main-header">
    <img class="logo-name" src="./assets/img/logo-name.png" alt="Logo und Name" />

    <button aria-label="Menü öffnen" (click)="openMenuDialog()">
        <p class="nuito32px700">{{ currentUser?.userName }}</p>
        <img src="./assets/img/avatar/{{currentUser?.profilePic}}.png" alt="" aria-hidden="true" />
        <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
</section>
}
